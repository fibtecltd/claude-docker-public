# Plugins baked into the image, one per line: NAME REPO SHA PATH
#
# NAME  directory name under /opt/claude/plugins; must equal the "name" in the
#       plugin's .claude-plugin/plugin.json (the fetch script checks this)
# REPO  git URL to fetch from
# SHA   full commit to fetch, so a build always gets the same bytes
# PATH  plugin directory inside the repo ("." when the repo is the plugin)
#
# Which of these a run loads is decided by profiles/<name>.plugins, not here.
# Change a pin with scripts/build/bump-plugin.sh; CI validates every entry.

