# ============================================================
# docker-compose.yml — Claude Code on ECS
#
# One service: the ecs-base image, for local runs and smoke tests.
# ecs-deploy is built by CI, or by `docker build --target ecs-deploy`.
#
# Usage:
#   Build:        docker compose build claude-ecs-base
#   Headless:     docker compose run --rm claude-ecs-base -p "say hi"
#   No TTY:       docker compose run --rm -T claude-ecs-base -p "..." > out.txt
#   Interactive:  docker compose run --rm claude-ecs-base
#   Shell:        docker compose run --rm --entrypoint bash claude-ecs-base
#
# Everything is baked into the image: no volumes, each run is disposable.
# ANTHROPIC_API_KEY is resolved by Compose from the shell or from the .env file
# next to this file, so nothing needs exporting. CLAUDE_PROFILE (core, pyvar or a
# profile you add; core when unset) and the two GitHub tokens are resolved the
# same way. Only variables listed under `environment` reach the container (the
# .env file itself is not passed in); add more deliberately.
# ============================================================

services:
  claude-ecs-base:
    build:
      context: .
      dockerfile: Dockerfile
      target: ecs-base
    image: claude-ecs-base:latest
    stdin_open: true
    tty: true
    environment:
      - ANTHROPIC_API_KEY
      - CLAUDE_PROFILE
      # GitHub access: the github plugin's MCP server reads
      # GITHUB_PERSONAL_ACCESS_TOKEN, the gh CLI reads GITHUB_TOKEN. Unset
      # variables are simply not passed.
      - GITHUB_PERSONAL_ACCESS_TOKEN
      - GITHUB_TOKEN
    # Plain Docker bridge network; no project network is declared.
    network_mode: bridge
    working_dir: /workspace
